kind: Deployment
apiVersion: apps/v1
metadata:
  name: frontend-deployment
  namespace: chat-app
  labels:
    app: frontend
    env: production
    version: v1
    owner: riya
    purpose: demo
    created-by: riya
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      name: frontend-pod
      namespace: chat-app
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend-container
          image: neo4j20212021/frontend-chatapp:latest
          ports:
            - containerPort: 80
          env:
            - name: NODE_ENV
              value: "production"
  