kind: Deployment
apiVersion: apps/v1
metadata:
  name: mongodb-deployment
  namespace: chat-app
  labels:
    app: mongodb
    env: production
    version: v1
    owner: riya
    purpose: demo
    created-by: riya
    volume-type: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
      
  template:
    metadata:
      name: mongodb-pod
      namespace: chat-app
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb-container
          image: mongo:latest
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "mongo-admin"
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: "secret-password"

      volumes:
        - name: database-volume
          persistentVolumeClaim:
            claimName: database-pvc
  