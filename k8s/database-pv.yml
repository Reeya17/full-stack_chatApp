apiVersion: v1
kind: PersistentVolume
metadata:
  name: database-pv
  namespace: chat-app
  labels:
    app: chat-app
    env: production
    version: v1
    owner: riya
    purpose: demo
    created-by: riya
    volume-type: database
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 5Gi
  hostPath:
    path: /data